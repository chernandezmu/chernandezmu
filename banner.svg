<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c4b5fd">
        <animate attributeName="stop-color" values="#c4b5fd;#a78bfa;#f59e0b;#c4b5fd" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <path d="M0 210 Q 300 170 600 205 T 1200 195 V260 H0 Z" fill="#a78bfa" opacity="0.12">
    <animate attributeName="d" dur="10s" repeatCount="indefinite"
      values="M0 210 Q 300 170 600 205 T 1200 195 V260 H0 Z;
              M0 200 Q 300 235 600 195 T 1200 210 V260 H0 Z;
              M0 210 Q 300 170 600 205 T 1200 195 V260 H0 Z"/>
  </path>
  <path d="M0 225 Q 300 200 600 230 T 1200 220 V260 H0 Z" fill="#7c3aed" opacity="0.18">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="M0 225 Q 300 200 600 230 T 1200 220 V260 H0 Z;
              M0 230 Q 300 250 600 215 T 1200 230 V260 H0 Z;
              M0 225 Q 300 200 600 230 T 1200 220 V260 H0 Z"/>
  </path>
  <g fill="#ffffff" opacity="0.5">
    <circle cx="140" cy="60" r="2"/><circle cx="1050" cy="50" r="2.5"/>
    <circle cx="920" cy="140" r="1.5"/><circle cx="260" cy="150" r="1.5"/>
    <circle cx="700" cy="40" r="1.5"/>
  </g>
  <text x="600" y="115" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="58" font-weight="700" fill="url(#txt)">Carlos Hernández</text>
  <text x="600" y="162" text-anchor="middle" font-family="Consolas, 'Fira Code', monospace"
